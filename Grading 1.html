<html>
<head>
    <title>Calculate Grade</title>
</head>
<body>

    <h2>Calculate Grade</h2>
    
    Enter Amount: <input type="number" id="scoreInput" value="85">
    <button onclick="calculateGrade()">Submit</button>
    
    <p id="result">You got an A</p>

    <script>
        function calculateGrade() {
            var score = document.getElementById("scoreInput").value;
            var grade = "";
            if (score >= 80) {
                grade = "A";
            } else if (score >= 70) {
                grade = "B";
            } else if (score >= 60) {
                grade = "C";
            } else if (score >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }
            document.getElementById("result").innerHTML = "You got an " + grade;
        }
    </script>

</body>
</html>
