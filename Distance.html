<html>
<head>
    <title>Distance from University</title>
</head>
<body>

    <h2>How far from University?</h2>
    
    X value: <input type="number" id="xInput" required>
    <br><br>
    Y value: <input type="number" id="yInput" required>
    <br><br>

    <button onclick="calculateDistance()">Submit</button>
    <button onclick="window.history.back()">Back</button>
    
    <p id="result"></p>

    <script>
        function calculateDistance() {
            var x = document.getElementById("xInput").value;
            var y = document.getElementById("yInput").value;
            
            if (x === "" || y === "") {
                alert("Please enter both X and Y values.");
                return;
            }

            x = Number(x);
            y = Number(y);
            var distance = Math.sqrt((x * x) + (y * y));
            
            document.getElementById("result").innerHTML = "Distance = " + distance;
        }
    </script>

</body>
</html>
